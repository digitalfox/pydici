{# Fragment that display won rate graph to be included with a jquery load #}
{# One must include in its extrajs block core/_billboard.html to load according js/css #} {% load i18n %}

{% if graph_data %}
<div id="won_rate_graph"></div>
    <script type="text/javascript">
        var chart = bb.generate({
        bindto: '#won_rate_graph',
        data: {
             x: "x",
             columns: {{ graph_data | safe }},
             type: 'spline',
             names: {
                "won-rate-renewal": '{% trans "won rate (renewal)" %}',
                "won-rate-newbiz": '{% trans "won rate (new business)" %}',
                "won-rate-renewal-MA": '{% trans "won rate (renewal) MA180" %}',
                "won-rate-newbiz-MA": '{% trans "won rate (new business) MA180" %}',
                },
                colors: {
                    "won-rate-renewal": "{{ colors.0 }}",
                    "won-rate-newbiz": "{{ colors.1 }}",
                    "won-rate-renewal-MA": "{{ colors.0 }}",
                    "won-rate-newbiz-MA": "{{ colors.1 }}"
                }
        },
        spline: {interpolation: { type: "monotone" }},
        point: {
            show: false
        },
        grid: {
            y: { show: true },
        },
        axis: {
            x: {
                type: 'timeseries',
                tick: {
                    format: '%Y-%m',
                    rotate: 45,
                },
            },
            y: {
                label : {
                    text: '{% trans "won rate (%)" %}',
                    position: 'outer-middle',
                },
                max: 100,
                padding: 0,
            },
        },
        line: {
            classes: ["line-plain", "line-plain", "line-dotted", "line-dotted"],
        },
      });
    </script>
{% endif %}
